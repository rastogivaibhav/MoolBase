services:
  graphenedb:
    build: .
    environment:
      GRAPHENEDB_API_KEY: ${GRAPHENEDB_API_KEY:?Set GRAPHENEDB_API_KEY}
    volumes:
      - graphenedb-data:/var/lib/graphenedb
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    environment:
      GRAPHENEDB_HOST: ${GRAPHENEDB_HOST:?Set GRAPHENEDB_HOST}
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      graphenedb:
        condition: service_healthy

networks:
  backend:
    internal: false

volumes:
  graphenedb-data:
  caddy-data:
  caddy-config:
