apiVersion: v1
kind: Secret
metadata:
  name: evidence-lab-secrets
  namespace: graphenedb-evidence-lab
type: Opaque
stringData:
  EVIDENCE_LAB_ALLOWED_ORIGINS: "https://YOUR-CHATGPT-SITE.example,https://evidence-lab.example.com"
  EVIDENCE_LAB_ALLOWED_HOSTS: "evidence-lab.example.com"
  EVIDENCE_LAB_KUBERNETES_WORKER_IMAGE: "ghcr.io/rastogivaibhav/graphenedb-evidence-lab-worker:0.2.0"
  EVIDENCE_LAB_KUBERNETES_IMAGE_PULL_SECRET: "ghcr-pull"
  GRAPHENEDB_SOURCE_COMMIT: "REPLACE_WITH_VERIFIED_COMMIT"
  GRAPHENEDB_PUBLIC_VERSION: "v0.6.0-alpha.1"

# Create ghcr-pull separately as a kubernetes.io/dockerconfigjson secret.
# Never place registry credentials in this file or commit a populated copy.
