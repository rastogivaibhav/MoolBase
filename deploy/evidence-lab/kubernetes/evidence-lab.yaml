apiVersion: v1
kind: Namespace
metadata:
  name: graphenedb-evidence-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-lab-gateway
  namespace: graphenedb-evidence-lab
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-lab-worker
  namespace: graphenedb-evidence-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evidence-lab-job-controller
  namespace: graphenedb-evidence-lab
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evidence-lab-job-controller
  namespace: graphenedb-evidence-lab
subjects:
  - kind: ServiceAccount
    name: evidence-lab-gateway
    namespace: graphenedb-evidence-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evidence-lab-job-controller
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidence-lab-data
  namespace: graphenedb-evidence-lab
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-lab-config
  namespace: graphenedb-evidence-lab
data:
  EVIDENCE_LAB_BACKEND: kubernetes
  EVIDENCE_LAB_PUBLIC_MODE: "true"
  EVIDENCE_LAB_DATA_DIR: /var/lib/evidence-lab
  EVIDENCE_LAB_SAMPLES_DIR: /opt/evidence-lab/samples
  EVIDENCE_LAB_SESSION_TTL_SECONDS: "3600"
  EVIDENCE_LAB_MAX_UPLOAD_BYTES: "5242880"
  EVIDENCE_LAB_MAX_UPLOAD_FILES: "8"
  EVIDENCE_LAB_MAX_NODES: "5000"
  EVIDENCE_LAB_MAX_EDGES: "20000"
  EVIDENCE_LAB_MAX_QUERIES: "5"
  EVIDENCE_LAB_MAX_ARCHIVE_MEMBERS: "64"
  EVIDENCE_LAB_MAX_ARCHIVE_UNCOMPRESSED_BYTES: "20971520"
  EVIDENCE_LAB_MAX_ARCHIVE_COMPRESSION_RATIO: "100"
  EVIDENCE_LAB_BLOCK_SECRETS: "true"
  EVIDENCE_LAB_CLAMAV_HOST: evidence-lab-clamav
  EVIDENCE_LAB_CLAMAV_PORT: "3310"
  EVIDENCE_LAB_CLAMAV_REQUIRED: "true"
  EVIDENCE_LAB_RATE_LIMIT_REQUESTS: "120"
  EVIDENCE_LAB_RATE_LIMIT_WINDOW_SECONDS: "60"
  EVIDENCE_LAB_RUN_TIMEOUT_SECONDS: "120"
  EVIDENCE_LAB_KUBERNETES_NAMESPACE: graphenedb-evidence-lab
  EVIDENCE_LAB_KUBERNETES_PVC: evidence-lab-data
  EVIDENCE_LAB_KUBERNETES_MOUNT_PATH: /var/lib/evidence-lab
  EVIDENCE_LAB_KUBERNETES_SERVICE_ACCOUNT: evidence-lab-worker
  EVIDENCE_LAB_KUBERNETES_IMAGE_PULL_SECRET: ghcr-pull
  EVIDENCE_LAB_KUBERNETES_DELETE_JOBS: "true"
  EVIDENCE_LAB_WORKER_CPU_REQUEST: 250m
  EVIDENCE_LAB_WORKER_CPU_LIMIT: "1"
  EVIDENCE_LAB_WORKER_MEMORY_REQUEST: 256Mi
  EVIDENCE_LAB_WORKER_MEMORY_LIMIT: 1Gi
  EVIDENCE_LAB_WORKER_EPHEMERAL_STORAGE_LIMIT: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-lab-clamav
  namespace: graphenedb-evidence-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evidence-lab-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidence-lab-clamav
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamd
          image: clamav/clamav:stable
          ports:
            - name: clamd
              containerPort: 3310
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-lab-clamav
  namespace: graphenedb-evidence-lab
spec:
  selector:
    app.kubernetes.io/name: evidence-lab-clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-lab-gateway
  namespace: graphenedb-evidence-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphenedb-evidence-lab
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphenedb-evidence-lab
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: evidence-lab-gateway
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/rastogivaibhav/graphenedb-evidence-lab-gateway:0.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: evidence-lab-config
            - secretRef:
                name: evidence-lab-secrets
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/evidence-lab
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /v1/public/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/public/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: evidence-lab-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-lab-gateway
  namespace: graphenedb-evidence-lab
spec:
  selector:
    app.kubernetes.io/name: graphenedb-evidence-lab
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evidence-lab-worker-deny-all
  namespace: graphenedb-evidence-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: graphenedb-evidence-lab-worker
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evidence-lab-clamav-ingress
  namespace: graphenedb-evidence-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evidence-lab-clamav
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: graphenedb-evidence-lab
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 3310
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evidence-lab-gateway
  namespace: graphenedb-evidence-lab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "150"
    nginx.ingress.kubernetes.io/limit-rps: "3"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["evidence-lab.example.com"]
      secretName: evidence-lab-tls
  rules:
    - host: evidence-lab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evidence-lab-gateway
                port:
                  name: http
