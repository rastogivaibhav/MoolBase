apiVersion: v1
kind: LimitRange
metadata:
  name: evidence-lab-container-limits
  namespace: graphenedb-evidence-lab
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: evidence-lab-namespace-quota
  namespace: graphenedb-evidence-lab
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    count/jobs.batch: "20"
    count/cronjobs.batch: "2"
    pods: "25"
    persistentvolumeclaims: "2"
    requests.storage: 20Gi
