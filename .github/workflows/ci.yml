name: GrapheneDB CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-build-test:
    name: Release build/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Unix script execution
        if: runner.os != 'Windows'
        run: chmod +x scripts/*.sh
      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DGRAPHENEDB_BUILD_TESTS=ON -DGRAPHENEDB_BUILD_BENCH=ON -DGRAPHENEDB_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build-release --config Release -j 2
      - name: Test
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Package install consumer smoke
        if: runner.os != 'Windows'
        run: ./scripts/verify_package_install.sh
      - name: Package install consumer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_package_install.ps1
      - name: Run uniqueness demo
        if: runner.os != 'Windows'
        run: ./build-release/graphenedb_uniqueness_demo

  ga-readiness-smoke:
    name: GA readiness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore script execution
        run: chmod +x scripts/*.sh
      - name: Run GA readiness smoke
        run: |
          EXTRACTION_DOCS=5 \
          EXTRACTION_NODES_PER_DOC=10 \
          EXTRACTION_QUERIES=5 \
          STORAGE_NODES=500 \
          STORAGE_QUERIES=5 \
          DIM=16 \
          ./scripts/run_ga_readiness.sh
      - name: Write GA status report
        run: ./scripts/write_ga_status_report.sh
      - name: Upload GA readiness report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-readiness-report
          path: |
            reports/ga-readiness/
            reports/GA_STATUS_REPORT.md

  release-candidate-bundle-smoke:
    name: Release candidate bundle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore script execution
        run: chmod +x scripts/*.sh
      - name: Run release candidate bundle smoke
        run: |
          BUILD_DIR=build-rc-bundle-ci \
          GA_REPORT_DIR=reports/ga-readiness \
          EVIDENCE_DIR=reports/ga-evidence \
          PACKAGE_OUT=$PWD/graphenedb-install-package-ci.zip \
          VECTOR_INDEX_RECALL_NODES=300 \
          VECTOR_INDEX_RECALL_QUERIES=10 \
          VECTOR_INDEX_RECALL_DIM=16 \
          VECTOR_INDEX_RECALL_K=5 \
          EXTRACTION_DOCS=2 \
          EXTRACTION_NODES_PER_DOC=4 \
          EXTRACTION_QUERIES=2 \
          STORAGE_NODES=200 \
          STORAGE_QUERIES=4 \
          DIM=16 \
          ./scripts/run_release_candidate_bundle.sh
      - name: Upload release candidate bundle artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-bundle
          path: |
            graphenedb-install-package-ci.zip
            graphenedb-install-package-ci.zip.sha256
            graphenedb-install-package-ci.zip.manifest.json
            reports/ga-readiness/
            reports/ga-evidence/
            reports/GA_STATUS_REPORT.md

  preview-hardware-profile-smoke:
    name: Preview hardware profile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore script execution
        run: chmod +x scripts/*.sh
      - name: Run preview hardware profile smoke
        run: |
          BUILD_DIR=build-preview-profile-ci \
          REPORT_DIR=reports/preview-hardware \
          VECTOR_BASELINE_INCIDENTS=300 \
          VECTOR_BASELINE_QUERIES=20 \
          VECTOR_BASELINE_DIM=16 \
          VECTOR_INDEX_NODES=300 \
          VECTOR_INDEX_QUERIES=20 \
          VECTOR_INDEX_DIM=16 \
          VECTOR_INDEX_K=5 \
          EXTRACTION_DOCS=5 \
          EXTRACTION_NODES_PER_DOC=10 \
          EXTRACTION_QUERIES=5 \
          EXTRACTION_DIM=16 \
          STORAGE_NODES=500 \
          STORAGE_QUERIES=10 \
          STORAGE_DIM=16 \
          ./scripts/run_preview_hardware_profile.sh
      - name: Upload preview hardware profile artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-hardware-profile
          path: |
            reports/preview-hardware/

  sanitizer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore script execution
        run: chmod +x scripts/*.sh
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make
      - name: ASAN/UBSAN selected gates
        run: JOBS=2 ./scripts/run_sanitizers.sh

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore script execution
        run: chmod +x scripts/*.sh
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y cmake clang make
      - name: Fuzz smoke
        run: RUNS=100 ./scripts/run_fuzz_smoke.sh
