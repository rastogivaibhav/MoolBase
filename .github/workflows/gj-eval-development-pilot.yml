name: GJ-Eval Development Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - "bench/gj-eval-v1"
    paths:
      - "benchmarks/gj_eval/**"
      - "docs/benchmarks/GJ_EVAL_V1_SPEC.md"
      - ".github/workflows/gj-eval-development-pilot.yml"

permissions:
  contents: read

jobs:
  primary-pilot:
    runs-on: ubuntu-22.04
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile GJ-Eval Python
        run: python -m compileall -q benchmarks/gj_eval

      - name: Gate 1 - provider-free harness invariants
        run: |
          python benchmarks/gj_eval/self_test.py | tee /tmp/gj-self-test.log
          grep -q '"gj_eval_self_test": true' /tmp/gj-self-test.log
          grep -q '"oracle_redaction": true' /tmp/gj-self-test.log
          grep -q '"adapter_failure_not_abstention": true' /tmp/gj-self-test.log

      - name: Gate 2A - 100-case Jev transport contract
        run: |
          python benchmarks/gj_eval/jev_contract_test.py | tee /tmp/gj-jev-contract.log
          grep -q '"jev_contract_test": true' /tmp/gj-jev-contract.log
          grep -q '"canonical_tasks": 100' /tmp/gj-jev-contract.log
          grep -q '"opencode_free_transport": true' /tmp/gj-jev-contract.log
          grep -q '"typesafe_reference_transport": true' /tmp/gj-jev-contract.log

      - name: Configure GrapheneDB
        run: >
          cmake -S . -B build-gj-pilot
          -DCMAKE_BUILD_TYPE=Release
          -DGRAPHENEDB_BUILD_TESTS=OFF
          -DGRAPHENEDB_BUILD_BENCH=OFF
          -DGRAPHENEDB_BUILD_EXAMPLES=OFF

      - name: Build GrapheneDB server
        run: cmake --build build-gj-pilot --target graphenedb_server -j 2

      - name: Gate 2B - 100-case real Graphene G6 contract
        run: |
          python benchmarks/gj_eval/graphene_contract_test.py build-gj-pilot/graphenedb_server | tee /tmp/gj-g6-contract.log
          grep -q '"graphene_g6_contract_test": true' /tmp/gj-g6-contract.log
          grep -q '"canonical_tasks": 100' /tmp/gj-g6-contract.log
          grep -q '"persistent_state": true' /tmp/gj-g6-contract.log
          grep -q '"idempotent_replay": true' /tmp/gj-g6-contract.log

      - name: Select authenticated Jev transport
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "GJ_JEV_PROVIDER=opencode" >> "$GITHUB_ENV"
            echo "Using OpenCode Zen jev-1.13-free."
          elif [ -n "$TYPESAFE_API_KEY" ]; then
            echo "GJ_JEV_PROVIDER=typesafe" >> "$GITHUB_ENV"
            echo "Using direct TypeSafe jev-1.13.0."
          else
            echo "Set OPENCODE_API_KEY (preferred free route) or TYPESAFE_API_KEY."
            exit 2
          fi

      - name: Gate 2C - live Jev provider smoke
        run: |
          cat > /tmp/gj-jev-smoke.json <<'JSON'
          {
            "schema_version": 1,
            "world_id": "live-provider-smoke",
            "timestep": 0,
            "domain": "aiops",
            "variant": "base",
            "visible_state": [
              {
                "evidence_id": "smoke-e1",
                "source_id": "smoke-source",
                "source_family": "smoke-family",
                "claim": "Database saturation preceded checkout failures.",
                "supports": "database",
                "confidence": 0.95,
                "observed_at": "2026-01-01T00:00:00Z"
              }
            ],
            "choices": [
              {"id": "deployment", "label": "Deployment"},
              {"id": "database", "label": "Database"},
              {"id": "network", "label": "Network"},
              {"id": "certificate", "label": "Certificate"},
              {"id": "unknown", "label": "Unknown / insufficient evidence"}
            ],
            "tests": []
          }
          JSON
          python benchmarks/gj_eval/adapters/jev_http.py < /tmp/gj-jev-smoke.json | tee /tmp/gj-jev-smoke.out
          python - <<'PY'
          import json
          row=json.load(open("/tmp/gj-jev-smoke.out"))
          assert row["root_choice"] in {"deployment","database","network","certificate","unknown"}
          assert 0.0 <= float(row["selected_confidence"]) <= 1.0
          assert row["receipt"]["transport"] in {"opencode","typesafe"}
          print({"live_jev_smoke": True, "transport": row["receipt"]["transport"], "model": row["receipt"]["requested_model"]})
          PY

      - name: Generate frozen development worlds
        run: |
          mkdir -p reports/gj-eval-dev
          python benchmarks/gj_eval/generate_worldshift.py \
            --split development \
            --count 240 \
            --seed 1729 \
            --output reports/gj-eval-dev/worlds.jsonl

      - name: Run G6 Full Graphene
        run: |
          python benchmarks/gj_eval/run_graphene_managed.py \
            --server-binary build-gj-pilot/graphenedb_server \
            --worlds reports/gj-eval-dev/worlds.jsonl \
            --adapter benchmarks/gj_eval/adapters/graphene_http.py \
            --system graphenedb_full \
            --output reports/gj-eval-dev/graphenedb_full.jsonl

      - name: Run J1 Jev Structured
        run: |
          python benchmarks/gj_eval/run_command_adapter.py \
            --worlds reports/gj-eval-dev/worlds.jsonl \
            --adapter-cmd "python benchmarks/gj_eval/adapters/jev_http.py" \
            --system jev_structured \
            --state-mode structured \
            --timeout-s 60 \
            --output reports/gj-eval-dev/jev_structured.jsonl

      - name: Require complete primary prediction coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          worlds = [
              json.loads(x)
              for x in Path("reports/gj-eval-dev/worlds.jsonl").read_text().splitlines()
              if x
          ]
          expected = sum(len(w["timeline"]) for w in worlds)
          for name in ("graphenedb_full", "jev_structured"):
              rows = [
                  json.loads(x)
                  for x in Path(f"reports/gj-eval-dev/{name}.jsonl").read_text().splitlines()
                  if x
              ]
              assert len(rows) == expected, (name, len(rows), expected)
              statuses = [r["adapter_status"] for r in rows]
              assert all(s in {"ok", "error", "timeout"} for s in statuses)
              assert all(s == "ok" for s in statuses), (
                  name,
                  {s: statuses.count(s) for s in sorted(set(statuses))}
              )
          print({"worlds": len(worlds), "predictions_per_system": expected, "all_primary_predictions_ok": True})
          PY

      - name: Score primary systems
        run: |
          cat reports/gj-eval-dev/graphenedb_full.jsonl \
              reports/gj-eval-dev/jev_structured.jsonl \
              > reports/gj-eval-dev/primary_predictions.jsonl
          python benchmarks/gj_eval/score.py \
            --worlds reports/gj-eval-dev/worlds.jsonl \
            --predictions reports/gj-eval-dev/primary_predictions.jsonl \
            > reports/gj-eval-dev/score.json

      - name: Cluster-paired comparison
        run: |
          python benchmarks/gj_eval/compare.py \
            --worlds reports/gj-eval-dev/worlds.jsonl \
            --predictions reports/gj-eval-dev/primary_predictions.jsonl \
            --system-a graphenedb_full \
            --system-b jev_structured \
            > reports/gj-eval-dev/comparison.json

      - name: Write protocol receipt
        run: |
          python benchmarks/gj_eval/freeze_protocol.py \
            --output reports/gj-eval-dev/protocol_receipt.json

      - name: Upload raw development pilot
        uses: actions/upload-artifact@v4
        with:
          name: gj-eval-development-pilot
          path: reports/gj-eval-dev/
          if-no-files-found: error
          retention-days: 30
