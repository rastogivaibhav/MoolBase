name: Epistemic process freeze guard

on:
  pull_request:
    paths:
      - "benchmarks/epistemic_process_v1/**"
      - ".github/workflows/epistemic-process-freeze-guard.yml"
  push:
    branches: [master]
    paths:
      - "benchmarks/epistemic_process_v1/**"
      - ".github/workflows/epistemic-process-freeze-guard.yml"

permissions:
  contents: read

jobs:
  freeze-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify production/oracle boundary and score gate
        run: python benchmarks/epistemic_process_v1/freeze_guard_v1.py
      - name: Prove pre-freeze or frozen state is mechanically valid
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          proc = subprocess.run(
              [
                  sys.executable,
                  "benchmarks/epistemic_process_v1/freeze_guard_v1.py",
                  "--require-freeze-ready",
              ],
              capture_output=True,
              text=True,
              check=True,
          )
          report = json.loads(proc.stdout)
          assert report["freeze_ready"] is True
          assert report["production_runner_present"] is True
          assert report["production_runner_errors"] == []
          if report["freeze_manifest_present"]:
              assert report["score_gate_valid"] is True
              assert report["score_bearing_locked"] is False
          else:
              assert report["score_gate_valid"] is False
              assert report["score_bearing_locked"] is True
          print("freeze_guard_state_valid=true")
          PY
