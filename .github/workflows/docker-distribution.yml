name: MoolBase container build and optional Docker Hub publish
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.github/workflows/docker-distribution.yml'
      - 'docs/DOCKER_DISTRIBUTION.md'
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.github/workflows/docker-distribution.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Docker Hub (requires repository secrets)'
        type: boolean
        default: false
      tag:
        description: 'Explicit image tag, e.g. 0.6.0-audit.3'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub login
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && format('docker.io/{0}/moolbase:{1}', secrets.DOCKERHUB_USERNAME, inputs.tag) || 'moolbase:ci' }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
