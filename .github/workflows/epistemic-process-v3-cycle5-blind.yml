name: EP Process V3 Cycle 5 blind unscored mechanical

on:
  pull_request:
    paths:
      - "benchmarks/epistemic_process_v3/**"
      - "tools/epistemic_process_runtime_runner_v3_cycle5.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/epistemic-process-v3-cycle5-blind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep-process-v3-cycle5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cycle5-blind-mechanical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Protect frozen experiment and score boundary
        run: |
          set -euo pipefail
          check() {
            file="$1"; expected="$2"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "$actual  $file"
            test "$actual" = "$expected"
          }
          check benchmarks/epistemic_process_v3/semantic_contract_v3.json 3873b8a9383782c16fab7c813c5d0d4f969bd424f7fcd1f6818439a05803737f
          check benchmarks/epistemic_process_v3/measurement_model_v3.json 799252c703a06b8f9c1a66d697aaa1d965c9edbfb53acc769e37e8759368a5d0
          check benchmarks/epistemic_process_v3/metric_definitions_v3.json 3e95ef5b83ffad6a52c88833e750883d5d662ad595e55508e66ddd7348ab1b57
          check benchmarks/epistemic_process_v3/telemetry_contract_v3.json 900c186c56689b5c06222839e0d07755dcd81cba9bdf2722f86286347d4cef0a
          check benchmarks/epistemic_process_v3/claim_gates_v3.json 4ebf21dd6da6b603be8c5d3a417aaf0f292a17bfd5d298b6effbd5c7c3cb4d31
          check benchmarks/epistemic_process_v3/failure_policy_v3.json e6ab18eaf563bed4fd11ddcd665d118591ef0160c81f7fa064f68261153c74ec
          check benchmarks/epistemic_process_v3/statistics_plan_v3.json bc245acc76a10ecccf540fd3f9951dc865243a07965f6b0fa7949b401b4bd152
          check benchmarks/epistemic_process_v3/task_family_requirements_v3.json c20f9f03e540f945c66cb8b032ee123487c8b47b81cf60b34acbeed879cd1d8a
          check benchmarks/epistemic_process_v3/controls_v3.json 102ea72b6cb7caf134d6752890b50e38a1a72c8ad12649a83e7b361d143b9b94
          check benchmarks/epistemic_process_v3/generate_tasks_v3.py b14184302fcf736f7fab46edf72c11e528719d7f639fd1ecd517cfc9365185d7
          check benchmarks/epistemic_process_v3/tasks_v3_candidate.json 575c89930859bc6f23ecd218c7ed4c27032ec3a9f5a8c12bea1bbe84ab356829
          test ! -e benchmarks/epistemic_process_v3/score_freeze_v3.json
          test ! -e .github/workflows/epistemic-process-v3-score.yml
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("benchmarks/epistemic_process_v3")
          for name in (
              "measurement_model_v3.json","metric_definitions_v3.json",
              "telemetry_contract_v3.json","claim_gates_v3.json",
              "failure_policy_v3.json","statistics_plan_v3.json",
              "task_family_requirements_v3.json","controls_v3.json",
              "tasks_v3_candidate.json",
          ):
              assert json.loads((root/name).read_text())["score_bearing_authorized"] is False
          print("cycle5_score_authorization=false")
          PY

      - name: Compile Cycle 5 Python
        run: |
          set -euo pipefail
          python -m py_compile             benchmarks/epistemic_process_v3/strip_runtime_tasks_v3.py             benchmarks/epistemic_process_v3/build_cycle5_blind_inputs_v3.py             benchmarks/epistemic_process_v3/run_cycle5_blind_v3.py             benchmarks/epistemic_process_v3/validate_cycle5_mechanical_v3.py             benchmarks/epistemic_process_v3/summarize_cycle5_mechanical_v3.py             benchmarks/epistemic_process_v3/compare_cycle5_determinism_v3.py

      - name: Build blind inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle5 reports/epistemic-process-v3-cycle5
          python benchmarks/epistemic_process_v3/build_cycle5_blind_inputs_v3.py             --tasks benchmarks/epistemic_process_v3/tasks_v3_candidate.json             --runtime-out /tmp/cycle5/runtime-tasks.json             --environment-out /tmp/cycle5/harness-environment.json             | tee reports/epistemic-process-v3-cycle5/input-receipt.json
          runtime_hash="$(sha256sum /tmp/cycle5/runtime-tasks.json | awk '{print $1}')"
          test "$runtime_hash" = d298532080f8235ac19468a9a236792d56a386444e0bddeaf54dccff7746a91b
          echo "cycle5_runtime_view_hash=passed"

      - name: Configure production runtime
        run: |
          cmake -S . -B build-v3-cycle5             -DCMAKE_BUILD_TYPE=Release             -DGRAPHENEDB_BUILD_TESTS=ON             -DGRAPHENEDB_BUILD_SERVER=OFF             -DGRAPHENEDB_BUILD_BENCH=OFF             -DGRAPHENEDB_BUILD_EXAMPLES=OFF

      - name: Build runner and inherited Cycle 4 contracts
        run: |
          cmake --build build-v3-cycle5 --parallel 2 --target             graphenedb_epistemic_process_runtime_runner_v3_cycle5             graphenedb_epistemic_process_v3_cycle4_tests             graphenedb_epistemic_control_tests             graphenedb_hypokosh_runtime_tests

      - name: Prove Cycle 4 behavior remains mechanically intact
        run: |
          set -euo pipefail
          ./build-v3-cycle5/graphenedb_epistemic_process_v3_cycle4_tests
          ./build-v3-cycle5/graphenedb_epistemic_control_tests
          ./build-v3-cycle5/graphenedb_hypokosh_runtime_tests

      - name: Execute 384-episode x 5-profile blind campaign
        run: |
          set -euo pipefail
          python benchmarks/epistemic_process_v3/run_cycle5_blind_v3.py             --runtime-tasks /tmp/cycle5/runtime-tasks.json             --environment /tmp/cycle5/harness-environment.json             --runtime-runner ./build-v3-cycle5/graphenedb_epistemic_process_runtime_runner_v3_cycle5             --seed 20261005             --out /tmp/cycle5/raw-full.json

      - name: Validate mechanical completeness and mechanism exercise
        run: |
          set -euo pipefail
          python benchmarks/epistemic_process_v3/validate_cycle5_mechanical_v3.py             --raw /tmp/cycle5/raw-full.json             --runtime-tasks /tmp/cycle5/runtime-tasks.json             --environment /tmp/cycle5/harness-environment.json
          python benchmarks/epistemic_process_v3/summarize_cycle5_mechanical_v3.py             --raw /tmp/cycle5/raw-full.json             --environment /tmp/cycle5/harness-environment.json             --out reports/epistemic-process-v3-cycle5/mechanical-summary.json

      - name: Verify deterministic semantics on blind subset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path("/tmp/cycle5/runtime-tasks.json").read_text())
          ids=sorted(
              (hashlib.sha256(e["id"].encode()).hexdigest(),e["id"])
              for e in d["episodes"]
          )[:24]
          Path("/tmp/cycle5/subset-ids.txt").write_text(
              "\n".join(x[1] for x in ids)+"\n")
          print("cycle5_determinism_subset=24")
          PY
          ARGS=()
          while IFS= read -r id; do ARGS+=(--episode-id "$id"); done < /tmp/cycle5/subset-ids.txt
          python benchmarks/epistemic_process_v3/run_cycle5_blind_v3.py             --runtime-tasks /tmp/cycle5/runtime-tasks.json             --environment /tmp/cycle5/harness-environment.json             --runtime-runner ./build-v3-cycle5/graphenedb_epistemic_process_runtime_runner_v3_cycle5             --seed 20261005             --out /tmp/cycle5/replay-a.json "${ARGS[@]}"
          python benchmarks/epistemic_process_v3/run_cycle5_blind_v3.py             --runtime-tasks /tmp/cycle5/runtime-tasks.json             --environment /tmp/cycle5/harness-environment.json             --runtime-runner ./build-v3-cycle5/graphenedb_epistemic_process_runtime_runner_v3_cycle5             --seed 20261005             --out /tmp/cycle5/replay-b.json "${ARGS[@]}"
          python benchmarks/epistemic_process_v3/compare_cycle5_determinism_v3.py             /tmp/cycle5/replay-a.json /tmp/cycle5/replay-b.json

      - name: Enforce blind evidence boundary
        run: |
          set -euo pipefail
          rm -f /tmp/cycle5/raw-full.json /tmp/cycle5/replay-a.json /tmp/cycle5/replay-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("reports/epistemic-process-v3-cycle5/mechanical-summary.json").read_text())
          assert summary["score_bearing"] is False
          assert summary["score_bearing_authorized"] is False
          assert summary["outcome_metrics_computed"] is False
          assert summary["oracle_join_performed"] is False
          forbidden=("accuracy","correctness","claim_status","earned_claim","expected_answer")
          encoded=json.dumps(summary).lower()
          for word in forbidden:
              assert word not in encoded, word
          print("cycle5_blind_boundary=passed")
          PY
          if find reports/epistemic-process-v3-cycle5 -type f | grep -E '/(raw|evaluation|claims|scores|accuracy)' ; then
            echo "outcome-bearing artifact escaped Cycle 5" >&2
            exit 1
          fi

      - name: Record Cycle 5 hashes
        run: |
          set -euo pipefail
          git rev-parse HEAD > reports/epistemic-process-v3-cycle5/head.txt
          git rev-parse 'HEAD^{tree}' > reports/epistemic-process-v3-cycle5/tree.txt
          sha256sum             tools/epistemic_process_runtime_runner_v3_cycle5.cpp             benchmarks/epistemic_process_v3/build_cycle5_blind_inputs_v3.py             benchmarks/epistemic_process_v3/run_cycle5_blind_v3.py             benchmarks/epistemic_process_v3/validate_cycle5_mechanical_v3.py             benchmarks/epistemic_process_v3/summarize_cycle5_mechanical_v3.py             benchmarks/epistemic_process_v3/compare_cycle5_determinism_v3.py             > reports/epistemic-process-v3-cycle5/checksums.sha256
          sha256sum /tmp/cycle5/runtime-tasks.json /tmp/cycle5/harness-environment.json             > reports/epistemic-process-v3-cycle5/blind-input-checksums.sha256

      - name: Upload mechanical evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ep-process-v3-cycle5-mechanical-${{ github.sha }}
          path: reports/epistemic-process-v3-cycle5/
          retention-days: 90
