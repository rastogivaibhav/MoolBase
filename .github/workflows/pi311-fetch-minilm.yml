name: PI3.11 MiniLM Evidence Fetch

on:
  push:
    branches:
      - pi3.4-promotion-readiness
    paths:
      - '.github/workflows/pi311-fetch-minilm.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/pi311-fetch-minilm.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch scoped MiniLM evidence
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 --max-time 120 \
            https://pi311-minilm-scoped-free-0819.onrender.com/ \
            -o pi311_minilm_scoped.json
          python - <<'PY'
          import json
          p=json.load(open('pi311_minilm_scoped.json'))
          assert p['dimension'] == 384
          assert len(p['queries']) == 1977
          assert p['scope'] == 'per-conversation/sample_id candidate isolation'
          print('PI311_MINILM_FETCH=PASS')
          print('hit10=', p['hit_at_10'])
          print('mrr10=', p['mrr_at_10'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pi311-minilm-scoped
          path: pi311_minilm_scoped.json
          retention-days: 1
