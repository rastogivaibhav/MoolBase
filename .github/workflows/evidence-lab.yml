name: Evidence Lab

on:
  pull_request:
    paths:
      - "apps/evidence_lab/**"
      - "deploy/evidence-lab/**"
      - "docker-compose.evidence-lab.yml"
      - "scripts/run_evidence_lab_local.sh"
      - "scripts/validate_evidence_lab_public.py"
      - ".github/workflows/evidence-lab.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tools/graphenedb_server*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway
        working-directory: apps/evidence_lab/gateway
        run: pip install -e '.[all]'
      - name: Run gateway and security tests
        working-directory: apps/evidence_lab/gateway
        env:
          EVIDENCE_LAB_BACKEND: recorded
          EVIDENCE_LAB_SAMPLES_DIR: ../samples
          EVIDENCE_LAB_DATA_DIR: /tmp/graphenedb-evidence-lab-ci
          EVIDENCE_LAB_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: pytest
      - name: Validate sample checksums
        run: |
          set -euo pipefail
          for sample in apps/evidence_lab/samples/*; do
            (cd "$sample" && sha256sum -c SHA256SUMS)
          done
      - name: Validate Python and static site syntax
        run: |
          python -m py_compile apps/evidence_lab/gateway/evidence_lab/*.py scripts/validate_evidence_lab_public.py
          node --check apps/evidence_lab/site/app.js

  exact-head-live-integration:
    runs-on: ubuntu-latest
    needs: gateway-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build toolchain and gateway
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
          pip install -e 'apps/evidence_lab/gateway[all]'
      - name: Build exact-head GrapheneDB server
        run: |
          cmake -S . -B build/evidence-lab-live -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRAPHENEDB_BUILD_TESTS=OFF \
            -DGRAPHENEDB_BUILD_SERVER=ON \
            -DGRAPHENEDB_BUILD_BENCH=OFF \
            -DGRAPHENEDB_BUILD_EXAMPLES=OFF
          cmake --build build/evidence-lab-live --target graphenedb_server --parallel 2
      - name: Start live Evidence Lab gateway
        env:
          EVIDENCE_LAB_BACKEND: live
          EVIDENCE_LAB_PUBLIC_MODE: "false"
          EVIDENCE_LAB_SAMPLES_DIR: ${{ github.workspace }}/apps/evidence_lab/samples
          EVIDENCE_LAB_DATA_DIR: /tmp/graphenedb-evidence-lab-live
          EVIDENCE_LAB_ALLOWED_HOSTS: localhost,127.0.0.1
          EVIDENCE_LAB_ALLOWED_ORIGINS: http://127.0.0.1:8088
          GRAPHENEDB_SERVER_BINARY: ${{ github.workspace }}/build/evidence-lab-live/graphenedb_server
          GRAPHENEDB_SOURCE_COMMIT: ${{ github.sha }}
          GRAPHENEDB_PUBLIC_VERSION: v0.6.0-alpha.1-ci
        run: |
          uvicorn evidence_lab.main:app --host 127.0.0.1 --port 8080 > /tmp/evidence-lab-gateway.log 2>&1 &
          echo $! > /tmp/evidence-lab-gateway.pid
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/v1/public/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/evidence-lab-gateway.log
          exit 1
      - name: Execute two samples, one upload and verify bundles
        run: |
          python scripts/validate_evidence_lab_public.py \
            http://127.0.0.1:8080 \
            --expected-commit "${GITHUB_SHA}"
      - name: Stop gateway and preserve logs
        if: always()
        run: |
          if test -f /tmp/evidence-lab-gateway.pid; then
            kill "$(cat /tmp/evidence-lab-gateway.pid)" || true
          fi
          cat /tmp/evidence-lab-gateway.log || true

  container-builds:
    runs-on: ubuntu-latest
    needs: gateway-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build production gateway image
        run: docker build -f apps/evidence_lab/gateway/Dockerfile.production -t evidence-lab-gateway:test .
      - name: Build isolated worker image
        run: docker build -f apps/evidence_lab/worker/Dockerfile -t evidence-lab-worker:test .
