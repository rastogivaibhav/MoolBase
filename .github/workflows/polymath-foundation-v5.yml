name: Polymath Foundation v5 Native MoolBase and Actual Model

on:
  push:
    paths:
      - "research/polymath_foundation/v5/**"
      - "CMakeLists.txt"
      - ".github/workflows/polymath-foundation-v5.yml"
  pull_request:
    paths:
      - "research/polymath_foundation/v5/**"
      - "CMakeLists.txt"
      - ".github/workflows/polymath-foundation-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Frozen sample, provenance, prompt and grading integrity tests
        run: |
          set -euo pipefail
          python3 research/polymath_foundation/v5/test_integration.py

  native-and-model:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Write exact source and environment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/polymath_foundation_v5
          {
            echo "commit=${GITHUB_SHA}"
            python3 --version
            cmake --version | head -1
            c++ --version | head -1
            uname -a
          } > reports/polymath_foundation_v5/environment.txt
          sha256sum \
            research/polymath_foundation/v5/PREREGISTRATION.md \
            research/polymath_foundation/v5/native_card_context.cpp \
            research/polymath_foundation/v5/native_manifest.py \
            research/polymath_foundation/v5/run_integration.py \
            research/polymath_foundation/v5/score_integration.py \
            research/polymath_foundation/v3/cards.json \
            research/polymath_foundation/v3/challenge.py \
            research/polymath_foundation/v3/scorer.py \
            > reports/polymath_foundation_v5/source_hashes.sha256
      - name: Compile native GrapheneDB and HypoKosh/DWM integration
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-v5 -DCMAKE_BUILD_TYPE=Release \
            -DGRAPHENEDB_BUILD_TESTS=ON \
            -DGRAPHENEDB_BUILD_BENCH=OFF \
            -DGRAPHENEDB_BUILD_EXAMPLES=OFF \
            -DGRAPHENEDB_BUILD_SERVER=OFF
          cmake --build build-v5 --parallel 3 --target \
            moolbase_polymath_v5_native \
            graphenedb_polymath_relation_direction_tests
          ctest --test-dir build-v5 --output-on-failure \
            -R graphenedb_polymath_relation_direction_tests \
            2>&1 | tee reports/polymath_foundation_v5/native_direction.log
      - name: Strict native metadata manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 research/polymath_foundation/v5/native_manifest.py \
            --cards research/polymath_foundation/v3/cards.json \
            --manifest reports/polymath_foundation_v5/cards_manifest.tsv
      - name: Real persistent MoolBase retrieval and HypoKosh/DWM reasoner
        shell: bash
        run: |
          set -euo pipefail
          ./build-v5/moolbase_polymath_v5_native \
            reports/polymath_foundation_v5/cards_manifest.tsv \
            reports/polymath_foundation_v5/native_receipts.tsv \
            2>&1 | tee reports/polymath_foundation_v5/native_runtime.log
          python3 research/polymath_foundation/v5/native_manifest.py \
            --cards research/polymath_foundation/v3/cards.json \
            --native reports/polymath_foundation_v5/native_receipts.tsv \
            --output reports/polymath_foundation_v5/native_validation.json
          python3 research/polymath_foundation/v5/test_integration.py \
            --native-bin ./build-v5/moolbase_polymath_v5_native \
            2>&1 | tee reports/polymath_foundation_v5/native_negative_tests.log
      - name: Compile pinned CPU llama.cpp backend
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/ggml-org/llama.cpp /tmp/v5-llama
          git -C /tmp/v5-llama checkout ff5a23376725e5a889fa0bfb987b7541dc304da0
          git -C /tmp/v5-llama rev-parse HEAD > reports/polymath_foundation_v5/llama_commit.txt
          cmake -S /tmp/v5-llama -B /tmp/v5-llama/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build /tmp/v5-llama/build --parallel 3 --target llama-server
      - name: Download pinned public Qwen 1.5B weights and hash exact bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5-model
          curl --fail --location --retry 3 --retry-delay 5 \
            --output /tmp/v5-model/qwen.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          test "$(stat -c %s /tmp/v5-model/qwen.gguf)" -gt 600000000
          sha256sum /tmp/v5-model/qwen.gguf \
            > reports/polymath_foundation_v5/model_sha256.txt
      - name: Start local inference engine
        shell: bash
        run: |
          set -euo pipefail
          /tmp/v5-llama/build/bin/llama-server \
            --model /tmp/v5-model/qwen.gguf \
            --alias qwen2.5-1.5b-instruct \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --threads 4 --parallel 1 \
            > reports/polymath_foundation_v5/model_server.log 2>&1 &
          echo $! > reports/polymath_foundation_v5/model_server_pid.txt
          python3 - <<'PY'
          import time,urllib.request
          for i in range(180):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=2) as r:
                      if r.status==200:
                          print("f5_real_model_server=READY")
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("1.5B local model failed to start")
          PY
      - name: Actually execute four frozen LLM arms on 12 fixed tasks
        shell: bash
        run: |
          set -euo pipefail
          python3 research/polymath_foundation/v5/run_integration.py \
            --cards research/polymath_foundation/v3/cards.json \
            --native reports/polymath_foundation_v5/native_receipts.tsv \
            --model-file /tmp/v5-model/qwen.gguf \
            --server-commit ff5a23376725e5a889fa0bfb987b7541dc304da0 \
            --output reports/polymath_foundation_v5/raw_model_responses.json \
            2>&1 | tee reports/polymath_foundation_v5/model_run.log
      - name: Score only model-completed trials through frozen v3 oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 research/polymath_foundation/v5/score_integration.py \
            --cards research/polymath_foundation/v3/cards.json \
            --native reports/polymath_foundation_v5/native_receipts.tsv \
            --inference reports/polymath_foundation_v5/raw_model_responses.json \
            --out reports/polymath_foundation_v5/evaluation.json \
            2>&1 | tee reports/polymath_foundation_v5/evaluation.log
      - name: Hash all original raw and derived research receipts
        if: always()
        shell: bash
        run: |
          mkdir -p reports/polymath_foundation_v5
          (cd reports/polymath_foundation_v5 &&
            find . -type f ! -name manifest.sha256 -print0 |
            sort -z | xargs -0 -r sha256sum > manifest.sha256)
      - name: Preserve raw prompts, model responses, native traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moolbase-v5-native-actual-llm-${{ github.sha }}
          path: reports/polymath_foundation_v5/
          retention-days: 90
          if-no-files-found: warn
