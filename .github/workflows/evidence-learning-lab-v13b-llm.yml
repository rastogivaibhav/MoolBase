name: MoolBase v13B Actual 7B Direct vs Retrieval Event Baselines
on:
  push:
    paths:
      - "research/evidence_learning_lab/v13/**"
      - ".github/workflows/evidence-learning-lab-v13b-llm.yml"
  pull_request:
    paths:
      - "research/evidence_learning_lab/v13/**"
      - ".github/workflows/evidence-learning-lab-v13b-llm.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moolbase-v13b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify no oracle/future-event leakage and same source sets
        run: |
          set -euo pipefail
          python3 research/evidence_learning_lab/v13/test_llm_contract.py
          python3 research/evidence_learning_lab/v13/test_event_flow.py

  actual-pinned-7b-model:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Record exact sources and experiment
        run: |
          set -euo pipefail
          mkdir -p reports/evidence_learning_v13b
          echo "$GITHUB_SHA" > reports/evidence_learning_v13b/commit.txt
          python3 --version > reports/evidence_learning_v13b/environment.txt
          free -h >> reports/evidence_learning_v13b/environment.txt
          sha256sum research/evidence_learning_lab/v13/*.py \
            research/evidence_learning_lab/v13/V13B_LLM_PREREGISTRATION.md \
            > reports/evidence_learning_v13b/source_sha256.txt
      - name: Run no-leakage and same-corpus contract tests
        run: |
          set -euo pipefail
          python3 research/evidence_learning_lab/v13/test_llm_contract.py \
            2>&1 | tee reports/evidence_learning_v13b/llm_contract.log
      - name: Execute SQL operational events and seal separate cause controller
        run: |
          set -euo pipefail
          mkdir -p reports/evidence_learning_v13b/public \
            reports/evidence_learning_v13b/controller_oracle
          python3 research/evidence_learning_lab/v13/run_source_systems.py \
            --public reports/evidence_learning_v13b/public \
            --oracle reports/evidence_learning_v13b/controller_oracle \
            2>&1 | tee reports/evidence_learning_v13b/sql_event_run.log
      - name: Build pinned local CPU llama.cpp server
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/ggml-org/llama.cpp /tmp/v13b-llama
          git -C /tmp/v13b-llama checkout ff5a23376725e5a889fa0bfb987b7541dc304da0
          git -C /tmp/v13b-llama rev-parse HEAD \
            > reports/evidence_learning_v13b/llama_sha.txt
          cmake -S /tmp/v13b-llama -B /tmp/v13b-llama/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build /tmp/v13b-llama/build --parallel 3 --target llama-server
      - name: Fetch official pinned Apache-2.0 Qwen 7B Q3_K_M
        run: |
          set -euo pipefail
          mkdir -p /tmp/v13b-model
          curl --fail --location --retry 3 --retry-delay 5 \
            --output /tmp/v13b-model/qwen.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/293ca9a10157b0e5fc5cb32af8b636a88bede891/qwen2.5-7b-instruct-q3_k_m.gguf"
          test "$(stat -c %s /tmp/v13b-model/qwen.gguf)" -gt 3000000000
          sha256sum /tmp/v13b-model/qwen.gguf \
            > reports/evidence_learning_v13b/model_sha256.txt
      - name: Start real local 7B model inference
        run: |
          set -euo pipefail
          /tmp/v13b-llama/build/bin/llama-server \
            --model /tmp/v13b-model/qwen.gguf \
            --alias qwen2.5-7b-instruct \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --threads 4 --parallel 1 \
            > reports/evidence_learning_v13b/server.log 2>&1 &
          python3 - <<'PY'
          import time,urllib.request
          for i in range(180):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=3) as r:
                      if r.status==200:
                          print("v13b_actual_pinned_7b=READY")
                          break
              except Exception:pass
              time.sleep(2)
          else:raise SystemExit("7B server not ready")
          PY
      - name: Run 24 actual 7B completions direct vs chronological retrieval
        run: |
          set -euo pipefail
          python3 research/evidence_learning_lab/v13/run_llm_baselines.py \
            --public reports/evidence_learning_v13b/public \
            --model-file /tmp/v13b-model/qwen.gguf \
            --out reports/evidence_learning_v13b/model_predictions.json \
            2>&1 | tee reports/evidence_learning_v13b/model_run.log
      - name: After all completions score with hidden executed SQL intervention oracle
        run: |
          set -euo pipefail
          python3 research/evidence_learning_lab/v13/score_llm_baselines.py \
            --predictions reports/evidence_learning_v13b/model_predictions.json \
            --oracle-dir reports/evidence_learning_v13b/controller_oracle \
            --public reports/evidence_learning_v13b/public \
            --out reports/evidence_learning_v13b/llm_scores.json \
            2>&1 | tee reports/evidence_learning_v13b/scoring.log
      - name: Seal all real or incomplete model evidence
        if: always()
        run: |
          mkdir -p reports/evidence_learning_v13b
          (cd reports/evidence_learning_v13b &&
            find . -type f ! -name manifest.sha256 -print0 |
            sort -z | xargs -0 -r sha256sum > manifest.sha256)
      - name: Retain real model prompts/completions/latencies and hidden controller outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moolbase-v13b-actual-7b-event-baselines-${{ github.sha }}
          path: reports/evidence_learning_v13b/
          retention-days: 90
          if-no-files-found: warn
