[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moolbase-installer"
version = "0.1.0"
description = "First-run Docker setup for MoolBase developer preview"
readme = "docs/MOOLBASE_INIT.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "RASVAI"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
moolbase = "moolbase_installer.cli:main"

[tool.setuptools.packages.find]
include = ["moolbase_installer*"]
