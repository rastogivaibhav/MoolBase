openapi: 3.0.3
info:
  title: GrapheneDB HypoKosh Runtime Supplement
  version: 0.6.0
paths:
  /v1/reason/runtime:
    post:
      summary: Run the complete bounded HypoKosh experimental runtime
      description: >-
        Builds an immutable FiberBundle, evaluates StabilityCriticV0, plans
        corrective escape, performs convergence and opposition, allows bounded
        re-expansion, projects a governed epistemic status, and returns a
        deterministic reasoning receipt. No Graphene truth state is promoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1 }
                signature: { type: integer, format: uint64 }
                mode: { type: string, enum: [empirical, balanced, theoretical] }
                as_of: { type: string }
                semantic_candidates: { type: integer, minimum: 1, maximum: 64 }
                max_hops: { type: integer, minimum: 1, maximum: 16 }
                max_paths: { type: integer, minimum: 1, maximum: 256 }
                max_paths_per_root: { type: integer, minimum: 1, maximum: 64 }
                max_visited_states: { type: integer, minimum: 1, maximum: 200000 }
                minimum_confidence: { type: number, minimum: 0, maximum: 1 }
                reexpansion_threshold: { type: number, minimum: 0, maximum: 1 }
                max_recursive_cycles: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200': { description: Complete governed reasoning result and receipt }
        '400': { description: Invalid request }
