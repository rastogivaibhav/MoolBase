openapi: 3.0.3
info:
  title: GrapheneDB Pilot API
  version: 1.0.0
  description: >-
    Versioned HTTP contract for the GrapheneDB 0.6.0-rc1 controlled-pilot server.
    The server is intended to run behind an approved TLS reverse proxy.
servers:
  - url: http://127.0.0.1:8080
security:
  - ApiKeyAuth: []
paths:
  /v1/health:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/ready:
    get:
      security: []
      summary: Storage and capacity readiness probe
      responses:
        '200': { description: Ready }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /v1/version:
    get:
      security: []
      summary: Server, API, storage-format, and feature discovery
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
  /v1/nodes:
    post:
      summary: Create a lattice-backed node
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCreate' }
      responses:
        '201': { description: Created }
        '200': { description: Idempotent replay }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '507': { $ref: '#/components/responses/ErrorResponse' }
  /v1/nodes/{nodeId}:
    get:
      summary: Read a node by ID
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Node }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/facts:
    post:
      summary: Create a temporal fact
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemporalFactCreate' }
      responses:
        '201': { description: Created }
        '200': { description: Idempotent replay }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /v1/edges:
    post:
      summary: Create a typed edge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeCreate' }
      responses:
        '201': { description: Created }
  /v1/search/hybrid:
    post:
      summary: Search by the server embedding/vector path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1 }
                top_k: { type: integer, minimum: 1, maximum: 1000, default: 5 }
      responses:
        '200': { description: Search results }
  /v1/search/lattice:
    get:
      summary: Expand a physical lattice neighbourhood
      parameters:
        - name: node_id
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: hops
          in: query
          schema: { type: integer, minimum: 1, maximum: 64, default: 2 }
      responses:
        '200': { description: Neighbour IDs }
  /v1/admin/capacity:
    get:
      summary: Inspect physical lattice capacity
      responses:
        '200': { description: Capacity information }
  /v1/admin/validate:
    post:
      summary: Validate durable and lattice state
      responses:
        '200': { description: Validation passed }
        '500': { $ref: '#/components/responses/ErrorResponse' }
  /v1/admin/checkpoint:
    post:
      summary: Checkpoint live state and rotate the WAL
      responses:
        '200': { description: Checkpoint completed }
  /v1/admin/backup:
    post:
      summary: Create a filesystem backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination: { type: string, minLength: 1 }
      responses:
        '200': { description: Backup completed }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retry key, maximum 128 characters. Scoped to the endpoint.
      schema: { type: string, maxLength: 128 }
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, engine, server_version, api_version]
      properties:
        status: { type: string, enum: [ok] }
        engine: { type: string }
        server_version: { type: string }
        api_version: { type: integer }
    Version:
      type: object
      required: [server_version, api_version, storage_formats, features]
      properties:
        server_version: { type: string }
        api_version: { type: integer }
        storage_formats: { type: object, additionalProperties: { type: integer } }
        features: { type: array, items: { type: string } }
    NodeCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        source: { type: string }
        placement_policy:
          type: string
          enum: [spiral, semantic, semantic_causal_temporal]
        account: { type: string }
        service: { type: string }
        incident: { type: string }
        repo: { type: string }
    TemporalFactCreate:
      allOf:
        - $ref: '#/components/schemas/NodeCreate'
        - type: object
          properties:
            documented_at: { type: string }
            valid_from: { type: string }
            valid_until: { type: string, nullable: true }
            confidence: { type: number, minimum: 0, maximum: 1 }
    EdgeCreate:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, minimum: 0 }
        to: { type: integer, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1, default: 0.9 }
        origin:
          type: string
          enum: [observed, discovered, inferred, reinforced, hypothetical]
        role:
          type: string
          enum: [mechanistic, compressed, analogical, predictive, causal, contradicts, supports, supersedes]
        source_id: { type: string }
        derived_from: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
