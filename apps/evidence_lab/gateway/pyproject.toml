[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graphenedb-evidence-lab"
version = "0.1.0"
description = "Sandbox gateway for the GrapheneDB public developer Evidence Lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
